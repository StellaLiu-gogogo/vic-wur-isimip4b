# Product configuration of stage 06_postprocessing (task AD; D07, D08, D11). Read by static_fields.py and
# check_static.py, and from step AD3 on by the producer of the product units. Paths are relative to the workdir.
# Units, long names and comments of the ISIMIP variables are read from the protocol commit pinned by the campaign,
# never copied here; the campaign file is read, never changed.

product_grid:
  # D08: products are masked with the ISIMIP water_global land-sea mask; its grid is the product grid
  mask: raw/ISIMIP4b/InputData/geo_conditions/landseamask/landseamask_water-global.nc
  mask_variable: mask
  # D08 (2026-09-30): mask cells without an active 5' VIC cell, reported as missing in every product
  uncovered_cells_expected: 3310

fill_value: 1.0e+20                  # missing value of every product variable (D08, protocol chapter 5)

file_rules:                          # protocol chapter 5
  data_model: NETCDF4_CLASSIC
  complevel: 5                       # minimum compression level of the protocol

# global attributes the protocol requires in every product file (chapter 5); `contact` as "NAME <EMAIL>, ...".
# The producers stop while either is null. Set by the user on 2026-11-10.
attributes:
  institution: Wageningen University & Research
  contact: Sida Liu <sida.liu@wur.nl>

static:
  # ISIMIP static variables made from the domain of the parameter set (D07 part 3)
  variables: [cellarea, contfrac, landfrac]
  comments:
    landfrac: >-
      Equal to contfrac: VIC-WUR separates no inland water bodies (LAKES FALSE), so the simulated continental area
      is reported as land.
    contfrac: >-
      Area of the active 5 arcmin VIC-WUR cells inside the 0.5 degree cell divided by cellarea; every active 5 arcmin
      cell is simulated as whole land.
    cellarea: >-
      Sum of the WGS84 areas of the 36 5 arcmin cells of the 0.5 degree cell (domain file of the parameter set).
  # ISIMIP static variables not provided (D07 part 3), in addition to the campaign's not_provided list
  not_provided:
    soil: VIC-WUR has continuous soil parameters per cell and no soil types
  # relative difference of cellarea from the analytic WGS84 area of the 0.5 degree cell above which the check warns
  cellarea_tolerance: 1.0e-3
  # ISIMIP DDM30 network, used only to compare the upstream area of the dis outlets (D07 part 2)
  ddm30_flowdir: raw/ISIMIP4b/InputData/geo_conditions/river_routing/ddm30_flowdir_cru_neva.nc
  ddm30_variable: flowdirection
  ddm30_min_area_km2: 10000          # 0.5 degree cells compared: DDM30 upstream area at least this

# ISIMIP identity of every product file, recorded in the unit record for 08_delivery (D09, D11); the model name is
# D10 (open) and is given at delivery
identity:
  bias_adjustment: era5              # ISIMIP4b atmospheric forcing (docs/glossary.md, bias adjustment)
  region: global

# VIC-WUR water-use classes of the locked commit (plugin_def.h): 0 municipal, 1 energy, 2 manufacturing (ISIMIP
# industrial), 3 livestock, 4 irrigation; `all` sums every class
sectors: {municipal: 0, manufacturing: 2, irrigation: 4}

# How each ISIMIP variable is made from the VIC-WUR outputs (D07). The VIC outputs of every recipe must be exactly
# those of output.isimip in the campaign (make_unit.py stops otherwise). Keys:
#   terms     VIC outputs summed at 5 arcmin before the area-weighted mean (D07 part 1); a layered output is summed
#             over its layers unless `layers` is true
#   volumes   VIC outputs in hm3 summed per 0.5 degree cell and divided by its simulated area (kg m-2)
#   layers    keep the VIC soil layers (ISIMIP varying levels: lev, depth, depth_bnds)
#   outlet    the value of the 5 arcmin outlet cell (static/dis-outlets.nc; D07 part 2) instead of a mean
#   sector    water-use class of the *_SECT outputs (a name of `sectors`, or all)
#   times_forcing  multiply at 5 arcmin by this water-use forcing series of the run (consumption fraction; a missing
#             fraction counts as 0, as in the run check)
# Unit conversion follows the VIC unit of the output file and the protocol unit: mm -> kg m-2 s-1 divided by the
# seconds of the time step, mm -> kg m-2, C -> K (+273.15), cm -> m (x 0.01), m3 s-1 and 1 unchanged.
variables:
  qtot: {terms: [OUT_RUNOFF, OUT_BASEFLOW]}
  dis: {terms: [OUT_DISCHARGE], outlet: true}
  qs: {terms: [OUT_RUNOFF]}
  qsb: {terms: [OUT_BASEFLOW]}
  qg: {terms: [OUT_BASEFLOW]}
  qr: {terms: [OUT_BASEFLOW]}
  evap: {terms: [OUT_EVAP]}
  potevap: {terms: [OUT_PET]}
  soilmoist: {terms: [OUT_SOIL_MOIST], layers: true}
  rootmoist: {terms: [OUT_ROOTMOIST]}
  tsl: {terms: [OUT_SOIL_TEMP], layers: true}
  snd: {terms: [OUT_SNOW_DEPTH]}
  snm: {terms: [OUT_SNOW_MELT]}
  swe: {terms: [OUT_SWE, OUT_SNOW_CANOPY]}
  canopystor: {terms: [OUT_WDEW]}
  riverstor: {terms: [OUT_STREAM_MOIST]}
  reservoirstor: {volumes: [OUT_GDAM_STORAGE, OUT_LDAM_STORAGE]}
  tws: {terms: [OUT_SOIL_MOIST, OUT_SWE, OUT_SNOW_CANOPY, OUT_WDEW, OUT_SURFSTOR, OUT_STREAM_MOIST],
        volumes: [OUT_GDAM_STORAGE, OUT_LDAM_STORAGE]}
  lai: {terms: [OUT_LAI]}
  airrww: {terms: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT],
           sector: irrigation}
  airrwwgw: {terms: [OUT_WI_GW_SECT], sector: irrigation}
  airruse: {terms: [OUT_RECEIVED]}
  adomww: {terms: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT],
           sector: municipal}
  adomwwgw: {terms: [OUT_WI_GW_SECT], sector: municipal}
  adomuse: {terms: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT],
            sector: municipal, times_forcing: water_use/municipal_consumption_fraction}
  pdomww: {terms: [OUT_DE_GW_SECT, OUT_DE_SURF_SECT], sector: municipal}
  pdomwwgw: {terms: [OUT_DE_GW_SECT], sector: municipal}
  aindww: {terms: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT],
           sector: manufacturing}
  aindwwgw: {terms: [OUT_WI_GW_SECT], sector: manufacturing}
  ainduse: {terms: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT],
            sector: manufacturing, times_forcing: water_use/manufacturing_consumption_fraction}
  pindww: {terms: [OUT_DE_GW_SECT, OUT_DE_SURF_SECT], sector: manufacturing}
  pindwwgw: {terms: [OUT_DE_GW_SECT], sector: manufacturing}
  atotww: {terms: [OUT_WITHDRAWN]}
  atotuse: {terms: [OUT_CONSUMED]}
  ptotww: {terms: [OUT_DEMAND]}
  atotwwgw: {terms: [OUT_WI_GW_SECT], sector: all}
  ptotwwgw: {terms: [OUT_DE_GW_SECT], sector: all}
