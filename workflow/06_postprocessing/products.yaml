# Product configuration of stage 06_postprocessing (task AD; D07, D08, D11). Read by static_fields.py and
# check_static.py, and from step AD3 on by the producer of the product units. Paths are relative to the workdir.
# Units, long names and comments of the ISIMIP variables are read from the protocol commit pinned by the campaign,
# never copied here; the campaign file is read, never changed.

product_grid:
  # D08: products are masked with the ISIMIP water_global land-sea mask; its grid is the product grid
  mask: raw/ISIMIP4b/InputData/geo_conditions/landseamask/landseamask_water-global.nc
  mask_variable: mask
  # D08 (2026-09-30): mask cells without an active 5' VIC cell, reported as missing in every product
  uncovered_cells_expected: 3310

fill_value: 1.0e+20                  # missing value of every product variable (D08, protocol chapter 5)

file_rules:                          # protocol chapter 5
  data_model: NETCDF4_CLASSIC
  complevel: 5                       # minimum compression level of the protocol

# global attributes the protocol requires in every product file (chapter 5); `contact` as "NAME <EMAIL>, ...".
# The producers stop while either is null. Set by the user on 2026-11-10.
attributes:
  institution: Wageningen University & Research
  contact: Sida Liu <sida.liu@wur.nl>

static:
  # ISIMIP static variables made from the domain of the parameter set (D07 part 3)
  variables: [cellarea, contfrac, landfrac]
  comments:
    landfrac: >-
      Equal to contfrac: VIC-WUR separates no inland water bodies (LAKES FALSE), so the simulated continental area
      is reported as land.
    contfrac: >-
      Area of the active 5 arcmin VIC-WUR cells inside the 0.5 degree cell divided by cellarea; every active 5 arcmin
      cell is simulated as whole land.
    cellarea: >-
      Sum of the WGS84 areas of the 36 5 arcmin cells of the 0.5 degree cell (domain file of the parameter set).
  # ISIMIP static variables not provided (D07 part 3), in addition to the campaign's not_provided list
  not_provided:
    soil: VIC-WUR has continuous soil parameters per cell and no soil types
  # relative difference of cellarea from the analytic WGS84 area of the 0.5 degree cell above which the check warns
  cellarea_tolerance: 1.0e-3
  # ISIMIP DDM30 network, used only to compare the upstream area of the dis outlets (D07 part 2)
  ddm30_flowdir: raw/ISIMIP4b/InputData/geo_conditions/river_routing/ddm30_flowdir_cru_neva.nc
  ddm30_variable: flowdirection
  ddm30_min_area_km2: 10000          # 0.5 degree cells compared: DDM30 upstream area at least this

# ISIMIP identity of every product file, recorded in the unit record for 08_delivery (D09, D11); the model name is
# D10 (open) and is given at delivery
identity:
  bias_adjustment: era5              # ISIMIP4b atmospheric forcing (docs/glossary.md, bias adjustment)
  region: global

# VIC-WUR water-use classes of the locked commit (plugin_def.h): 0 municipal, 1 energy, 2 manufacturing (ISIMIP
# industrial), 3 livestock, 4 irrigation; `all` sums every class
sectors: {municipal: 0, manufacturing: 2, irrigation: 4}

# How each ISIMIP variable is made from the VIC-WUR outputs (D07). The VIC outputs of every recipe must be exactly
# those of output.isimip in the campaign (make_unit.py stops otherwise). Keys:
#   terms     VIC outputs summed at 5 arcmin before the area-weighted mean (D07 part 1); a layered output is summed
#             over its layers unless `layers` is true
#   volumes   VIC outputs in hm3 summed per 0.5 degree cell and divided by its simulated area (kg m-2)
#   layers    keep the VIC soil layers (ISIMIP varying levels: lev, depth, depth_bnds)
#   outlet    the value of the 5 arcmin outlet cell (static/dis-outlets.nc; D07 part 2) instead of a mean
#   sector    water-use class of the *_SECT outputs (a name of `sectors`, or all)
#   times_forcing  multiply at 5 arcmin by this water-use forcing series of the run (consumption fraction; a missing
#             fraction counts as 0, as in the run check)
#   exclude   {output, abs_above}: leave out of the mean every 5 arcmin cell and time step whose |output| (in its VIC
#             unit) exceeds abs_above; the 0.5 degree value is the weighted mean of the remaining active 5 arcmin
#             cells, and the fill value when none remains. The output must be in the stream of the time step. The
#             left-out cell-steps and the 0.5 degree cells made missing are listed in the unit record and counted in
#             the comment (D07 amendment 2026-11-11)
#   notes     names of `notes` whose text is appended to the comment of the product
#   nonrenewable_groundwater  true: add the groundwater part of the non-renewable withdrawal (`nonrenewable_split`),
#             computed per 5 arcmin cell, water-use class and time step and summed over the classes of the sector;
#             needs an entry in `campaign_exceptions`
# Unit conversion follows the VIC unit of the output file and the protocol unit: mm -> kg m-2 s-1 divided by the
# seconds of the time step, mm -> kg m-2, C -> K (+273.15), cm -> m (x 0.01), m3 s-1 and 1 unchanged.
variables:
  qtot: {terms: [OUT_RUNOFF, OUT_BASEFLOW], notes: [baseflow_repayment]}
  dis: {terms: [OUT_DISCHARGE], outlet: true}
  qs: {terms: [OUT_RUNOFF]}
  qsb: {terms: [OUT_BASEFLOW], notes: [baseflow_repayment]}
  qg: {terms: [OUT_BASEFLOW], notes: [baseflow_repayment]}
  qr: {terms: [OUT_BASEFLOW], notes: [baseflow_repayment]}
  # task T rule (user 2026-10-30; D07 amendment 2026-11-11): rare VIC snow-sublimation outliers; OUT_WATER_ERROR of
  # the monthly stream is the monthly mean of the daily water-balance error
  evap: {terms: [OUT_EVAP], exclude: {output: OUT_WATER_ERROR, abs_above: 1.0}}
  potevap: {terms: [OUT_PET]}
  soilmoist: {terms: [OUT_SOIL_MOIST], layers: true}
  rootmoist: {terms: [OUT_ROOTMOIST]}
  tsl: {terms: [OUT_SOIL_TEMP], layers: true}
  snd: {terms: [OUT_SNOW_DEPTH]}
  snm: {terms: [OUT_SNOW_MELT]}
  swe: {terms: [OUT_SWE, OUT_SNOW_CANOPY]}
  canopystor: {terms: [OUT_WDEW]}
  riverstor: {terms: [OUT_STREAM_MOIST]}
  reservoirstor: {volumes: [OUT_GDAM_STORAGE, OUT_LDAM_STORAGE]}
  tws: {terms: [OUT_SOIL_MOIST, OUT_SWE, OUT_SNOW_CANOPY, OUT_WDEW, OUT_SURFSTOR, OUT_STREAM_MOIST],
        volumes: [OUT_GDAM_STORAGE, OUT_LDAM_STORAGE]}
  lai: {terms: [OUT_LAI]}
  # F1 (user 2026-11-12, replacing option (a) of 2026-11-11): *wwgw = renewable groundwater (OUT_WI_GW_SECT) plus the
  # groundwater part of the non-renewable withdrawal; the totals hold the whole non-renewable withdrawal
  airrww: {terms: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT],
           sector: irrigation, notes: [nonrenewable_in_total]}
  airrwwgw: {terms: [OUT_WI_GW_SECT], sector: irrigation, nonrenewable_groundwater: true,
             notes: [nonrenewable_groundwater_part]}
  airruse: {terms: [OUT_RECEIVED]}
  adomww: {terms: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT],
           sector: municipal, notes: [nonrenewable_in_total]}
  adomwwgw: {terms: [OUT_WI_GW_SECT], sector: municipal, nonrenewable_groundwater: true,
             notes: [nonrenewable_groundwater_part]}
  adomuse: {terms: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT],
            sector: municipal, times_forcing: water_use/municipal_consumption_fraction,
            notes: [nonrenewable_in_total]}
  pdomww: {terms: [OUT_DE_GW_SECT, OUT_DE_SURF_SECT], sector: municipal}
  pdomwwgw: {terms: [OUT_DE_GW_SECT], sector: municipal}
  aindww: {terms: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT],
           sector: manufacturing, notes: [nonrenewable_in_total]}
  aindwwgw: {terms: [OUT_WI_GW_SECT], sector: manufacturing, nonrenewable_groundwater: true,
             notes: [nonrenewable_groundwater_part]}
  ainduse: {terms: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT],
            sector: manufacturing, times_forcing: water_use/manufacturing_consumption_fraction,
            notes: [nonrenewable_in_total]}
  pindww: {terms: [OUT_DE_GW_SECT, OUT_DE_SURF_SECT], sector: manufacturing}
  pindwwgw: {terms: [OUT_DE_GW_SECT], sector: manufacturing}
  atotww: {terms: [OUT_WITHDRAWN], notes: [nonrenewable_in_total]}
  atotuse: {terms: [OUT_CONSUMED], notes: [nonrenewable_in_total]}
  ptotww: {terms: [OUT_DEMAND]}
  atotwwgw: {terms: [OUT_WI_GW_SECT], sector: all, nonrenewable_groundwater: true,
             notes: [nonrenewable_groundwater_part]}
  ptotwwgw: {terms: [OUT_DE_GW_SECT], sector: all}

# Groundwater part of the non-renewable withdrawal (F1, user 2026-11-12; D07 amendment 2026-11-12). VIC-WUR a826251b
# with GWM FALSE (wu_run.c): the demand of a water-use class is split into a groundwater demand (OUT_DE_GW_SECT, by the
# groundwater fraction of the forcing) and a surface-water demand (OUT_DE_SURF_SECT); the local step serves the first
# from groundwater only and the second from the local river and dams only, the remote step serves what is left of
# both, and the non-renewable source takes the rest. Per 5 arcmin cell, class and time step:
#   Ug = max(0, demand_groundwater - sum(withdrawn_groundwater)), Us = max(0, demand_surface - sum(withdrawn_surface)),
#   groundwater part = nonrenewable x Ug / (Ug + Us), 0 where Ug + Us is 0
# (proportional rule; it lies between max(0, N - Us) and min(N, Ug), 4 % apart globally in the test run).
nonrenewable_split:
  nonrenewable: OUT_WI_NREN_SECT
  demand_groundwater: OUT_DE_GW_SECT
  withdrawn_groundwater: [OUT_WI_GW_SECT]
  demand_surface: OUT_DE_SURF_SECT
  withdrawn_surface: [OUT_WI_SURF_SECT, OUT_WI_DAM_SECT]

# Recipes that read VIC outputs beyond their campaign mapping (output.isimip), each with its decision. The campaign
# file is not changed while its runs are in production; the outputs are in its monthly stream.
campaign_exceptions:
  airrwwgw: D07 amendment 2026-11-12 (F1), plus the groundwater part of the non-renewable withdrawal
  adomwwgw: D07 amendment 2026-11-12 (F1), plus the groundwater part of the non-renewable withdrawal
  aindwwgw: D07 amendment 2026-11-12 (F1), plus the groundwater part of the non-renewable withdrawal
  atotwwgw: D07 amendment 2026-11-12 (F1), plus the groundwater part of the non-renewable withdrawal

# Texts appended to the comment of the products whose recipe names them (AD7 review: F1 user 2026-11-12, F2 option (a)
# user 2026-11-11; D07 amendments 2026-11-11 and 2026-11-12). VIC-WUR source a826251b: the non-renewable deficit is
# repaid from the baseflow in the routing (plugins/routing/src/rout_run.c) and from the return flows of water use
# (wu_run_local.c, wu_remote.c, wu_nonrenewable.c); the campaign sets no limit to the source
# (nonrenewable_limit_mm: null).
notes:
  nonrenewable_in_total: >-
    Includes the non-renewable source of VIC-WUR (OUT_WI_NREN_SECT): demand that the renewable sources (river water of
    the cell and of other cells, dams, groundwater of the deepest soil layer) cannot meet is taken from an unlimited
    store, whose deficit is repaid later from the baseflow and the return flows of water use. Its groundwater part is
    also in airrwwgw, adomwwgw, aindwwgw and atotwwgw.
  nonrenewable_groundwater_part: >-
    Renewable groundwater (OUT_WI_GW_SECT, the deepest VIC soil layer) plus the groundwater part of the non-renewable
    source of VIC-WUR (OUT_WI_NREN_SECT: demand that the renewable sources cannot meet, taken from an unlimited store
    whose deficit is repaid later from the baseflow and the return flows of water use). Per 5 arcmin cell, water-use
    class and month the non-renewable withdrawal is split in proportion to the groundwater demand and the
    surface-water demand left unmet by the local sources: Ug = max(0, OUT_DE_GW_SECT - OUT_WI_GW_SECT),
    Us = max(0, OUT_DE_SURF_SECT - OUT_WI_SURF_SECT - OUT_WI_DAM_SECT), groundwater part = OUT_WI_NREN_SECT x
    Ug / (Ug + Us). The rest of the non-renewable withdrawal is in the withdrawal totals (airrww, adomww, aindww,
    atotww) only.
  baseflow_repayment: >-
    OUT_BASEFLOW is the baseflow leaving the soil column. Where a cell has a non-renewable deficit (water taken from
    the unlimited non-renewable source of VIC-WUR and not yet repaid), part of it repays the deficit in the routing
    and never reaches the river, so it is included here but not in dis; VIC-WUR does not write that part separately.

# check of a product unit (check_unit.py)
unit_check:
  # time steps per year whose products are recomputed from the 5 arcmin output by another route (sums per cell
  # instead of the producer's matrix): the month (year mod 12) + 1 and the day of the year (year mod 28) + 1, so that
  # a 25-year chunk covers every month; the whole series is checked for coverage, time axis and value range
  recompute_steps_per_year: 1
  recompute_rel_tol: 1.0e-5          # relative to the largest absolute value of the field
  daily_monthly_rel_tol: 1.0e-4      # monthly mean of a daily product against the monthly product (warning above)
  identities:                        # 0.5 degree products that the recipes make equal (failed above 1e-5 relative)
    - [qtot, [qs, qsb]]
    - [qg, [qsb]]
    - [qr, [qsb]]
