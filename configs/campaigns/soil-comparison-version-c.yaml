# Campaign `soil-comparison-version-c`: the third comparison run of task Z (non-production, analysis/soil-comparison/;
# user, 2026-11-04). The campaigns soil-comparison-version-a, -b and -c are identical except for the parameter set (one
# parameter set per campaign): version-c is the candidate set whose 18 soil fields come from the MPR soil candidate of
# vic_parameter (SoilGrids through Cosby and the MPR operators, Nijssen effective depths, D1-D4 of its stage 2; a prior,
# not calibrated against discharge), everything else as version-a (workflow/03_parameters/soil/adopt_soil_fields.py,
# manifests/parameters/vic-global-5arcmin-version-c.yaml).
# Everything else is the production configuration of water-global-ec-earth3-esm-1-1 as of 2026-11-03 (main 602957e):
# the production build of VIC-WUR a826251b, the D19 dam files and the decomposition built for them, non-renewable
# withdrawal, the D03 outputs and the resources file (16 ranks x 8 threads, 500G, whole node). It differs from the
# production campaign only in: production false, one experiment (its histsoc historical segment), a restriction to
# 2011-2020 from a cold start in one chunk, no spin-up or run order. The run checks (check_run.py: water balance,
# GRDC) follow each run; the comparison of the runs (soil moisture of layer 2, baseflow, discharge; West Siberia
# and the Alps) is the analysis task analysis/soil-comparison/ (user, 2026-11-02).
campaign_id: soil-comparison-version-c
production: false
description: >-
  Comparison run of task Z with parameter set vic-global-5arcmin-version-c (the candidate set with the MPR soil of vic_parameter, not promoted: the comparison decides):
  the historical histsoc
  segment of h_ssp3hsoc-noadapt_default restricted to 2011-2020, cold start, one chunk, with the settings of
  campaign water-global-ec-earth3-esm-1-1 (VIC-WUR a826251b production build, D19 dam files, non-renewable
  withdrawal on, D03 output, 16 ranks x 8 threads, 500G, whole node). The campaigns with the other two sets are
  identical. Every output is a candidate; the outputs serve the comparison of the three sets.

model:
  lock: model/vic.lock.yaml
  commit: a826251b6a9b831f432ebd7b655f2b456388c5e4   # D01, frozen 2026-10-31
  driver: image
  coupling: standalone image driver, GWM FALSE, no MODFLOW coupling

parameter_set:
  id: vic-global-5arcmin-version-c
  # the candidate set with the MPR soil (task Z, user 2026-11-04; not promoted: the comparison decides)
  status: candidates
  # role -> file inside the parameter set (manifests/parameters/vic-global-5arcmin-version-c.yaml)
  files:
    domain: domain/vic_global_5min_domain_nogl.nc
    parameters: bundle/vic_global_5min_16class_landuse-union_root-b-zeng2001.nc
    routing: routing/vic_global_5min_routing.nc
    # the FILE decomposition rebuilt with the D19 dam list (workflow/03_parameters/routing/build_decomposition.py,
    # task L3; manifest entry decomposition_isimip4b); the adopted v2.0.0 file is excluded from promotion
    decomposition: routing/vic_global_5min_file_decomposition_wateruse_isimip4b-dams.nc
    irrigation: irrigation/vic_global_5min_irrigation_parameters.nc
    # soc scenario of a segment -> dam file (D19, construction years per DHF scenario; files of the dam component,
    # workflow/03_parameters/dams/README.md, task L). The SSP units without extrasoc dams use the 2021soc file.
    dams:
      histsoc: dams/vic_global_5min_dam_parameters_isimip4b_histsoc.nc
      1850soc: dams/vic_global_5min_dam_parameters_isimip4b_1850soc.nc
      2021soc: dams/vic_global_5min_dam_parameters_isimip4b_2021soc.nc
      2021soc-from-histsoc: dams/vic_global_5min_dam_parameters_isimip4b_2021soc.nc
      ssp1vlsoc-noadapt: dams/vic_global_5min_dam_parameters_isimip4b_2021soc.nc
      ssp3hsoc-noadapt: dams/vic_global_5min_dam_parameters_isimip4b_2021soc.nc
    water_use: water_use/vic_global_5min_wateruse_parameters_receiving-network.nc

protocol:
  path: raw/external/isimip-protocol-4/f9be7b0cdf83409315d9fa7da8581cc6fd6ff3e1
  commit: f9be7b0cdf83409315d9fa7da8581cc6fd6ff3e1
  simulation_round: ISIMIP4b
  sector: water_global

gcms:
  ec-earth3-esm-1-1:
    # the DKRZ input of this GCM is emission-driven: input aliases esm-picontrol, esm-hist, esm-scen7-*
    climate_input: emission-driven

# one experiment whose historical segment is histsoc (a unit with every year 1850-2021); the same experiment as
# campaigns production-config-check, dam-test and snow-density-test
experiments:
  ids: [h_ssp3hsoc-noadapt_default]
exclusions: []
sensitivity_equivalence:
  2021co2:
    same_as: default
    reason: VIC-WUR has no CO2-dependent process (docs/glossary.md, sensitivity scenario)

# Non-production restriction: one run (run ID <segment-id>__<label>) of 2011-2020 in one chunk (10 years <
# chunk_years 25; about 32 h with 3.0 h per model year) with the resources of the resources file.
restriction:
  periods: [historical]
  runs:
    years-2011-2020:
      years: [2011, 2020]

initialisation:
  # cold start: the initial moisture of the parameter file, no INIT_STATE; both comparison runs start the same way,
  # so the first years also show how the smoothed layer-2 storage settles (the comparison looks at 2016-2020 as well
  # as the whole period); dams register their first year of history and operate from 2012
  without_parent: cold_start
  # state written at the end of every run (first day after the last simulated day)
  state_at_end: true

# Spin-up is not simulated by this campaign (restriction); the keys are listed so that the resolver can report the
# full segment list. The production climate windows name the 2021soc chain, which this experiment does not have.
spinup:
  length_years: null
  climate_cycle: null

dhf_forcing:
  # soc scenario of a segment -> land-use and water-use forcing unit
  units:
    histsoc: histsoc
    1850soc: 1850soc
    2021soc: 2021soc
    2021soc-from-histsoc: 2021soc
    ssp1vlsoc-noadapt: ssp1vlsoc-noadapt
    ssp3hsoc-noadapt: ssp3hsoc-noadapt
  # units that are constant in time: a simulation year the unit does not contain uses the first unit year
  # with the same number of days (render/forcing_years.py)
  constant: [1850soc, 2021soc]

plugins:
  routing:
    enabled: true
    decomposition: FILE
    steps_per_day: 24            # the unit hydrographs of the routing file have 3600 s steps
  irrigation:
    enabled: true
    potential_irrigation: false
    efficient_irrigation: false
    offset_irrigation: false     # the irrigation file has no irrigation_offset
    paddy_bare_class: 16         # PBARE: bare-soil class of paddy fields
  dams:
    enabled: true
    # dam operation constants, written to the run's VIC constants file (CONSTANTS); equal to the compiled
    # defaults of the locked commit (plugins/general/src/plugin_init_library.c)
    alpha: 0.85
    beta: 0.6
    gamma: 5
  water_use:
    enabled: true                # irrigation and dam demand go through the wateruse plugin
    sectors: [municipal, manufacturing]   # no livestock sector (its forcing prefixes are not given)
    local_withdrawal: true
    remote_withdrawal: true
    compensation_withdrawal: false
    # on (user, 2026-10-28): without it the groundwater demand cannot be met and much demand stays unmet; demand
    # that local, remote, groundwater (deepest soil layer) and dam water cannot meet is met from a non-renewable
    # source, and the deficit is repaid from the cell's baseflow (wu_nonrenewable.c, rout_run.c)
    nonrenewable_withdrawal: true
    nonrenewable_limit_mm: null    # null: no limit on the deficit (compiled default NREN_LIM = INFINITY)
    nonrenewable_runoff: false
  landuse:
    enabled: true
  efr:
    enabled: false
  wofost:
    enabled: false

output:
  format: NETCDF4
  compress: 2
  history_frequency: NYEARS 1    # one file per stream and calendar year
  streams:
    daily: NDAYS 1
    monthly: NMONTHS 1
  # VIC outputs whose default aggregation (state: value at the end of the period) is replaced by the mean
  aggregation:
    OUT_SOIL_MOIST: AGG_TYPE_AVG
    OUT_ROOTMOIST: AGG_TYPE_AVG
    OUT_SOIL_TEMP: AGG_TYPE_AVG
    OUT_SNOW_DEPTH: AGG_TYPE_AVG
    OUT_SWE: AGG_TYPE_AVG
    OUT_SNOW_CANOPY: AGG_TYPE_AVG
    OUT_WDEW: AGG_TYPE_AVG
    OUT_SURFSTOR: AGG_TYPE_AVG
    OUT_STREAM_MOIST: AGG_TYPE_AVG
    OUT_GDAM_STORAGE: AGG_TYPE_AVG
    OUT_LDAM_STORAGE: AGG_TYPE_AVG
    OUT_LAI: AGG_TYPE_AVG
  # ISIMIP water_global variables (protocol definitions/variable/*.yaml) -> VIC outputs at the locked commit.
  # streams: where the VIC outputs are written; the protocol frequency is in `frequency`. Conversion to
  # ISIMIP units, sector arithmetic and 5' -> 0.5 degree aggregation happen in 06_postprocessing (D07).
  isimip:
    qtot: {vic: [OUT_RUNOFF, OUT_BASEFLOW], frequency: "daily & monthly", streams: [daily, monthly], rule: "sum"}
    dis: {vic: [OUT_DISCHARGE], frequency: "daily & monthly", streams: [daily, monthly], rule: "m3 s-1, mean over the period"}
    qs: {vic: [OUT_RUNOFF], frequency: "monthly", streams: [monthly]}
    qsb: {vic: [OUT_BASEFLOW], frequency: "monthly", streams: [monthly], rule: "outflow of the bottom soil layer; no groundwater store under GWM FALSE"}
    qg: {vic: [OUT_BASEFLOW], frequency: "monthly", streams: [monthly], rule: "seepage from the soil column reported as qg (protocol comment)"}
    qr: {vic: [OUT_BASEFLOW], frequency: "monthly", streams: [monthly], rule: "seepage reported as qr (protocol comment); OUT_RECHARGE is percolation between soil layers and is not qr"}
    evap: {vic: [OUT_EVAP], frequency: "monthly", streams: [monthly]}
    potevap: {vic: [OUT_PET], frequency: "monthly", streams: [monthly], rule: "VIC potential evapotranspiration of the actual vegetation"}
    soilmoist: {vic: [OUT_SOIL_MOIST], frequency: "daily if possible, else monthly", streams: [monthly], rule: "per layer"}
    rootmoist: {vic: [OUT_ROOTMOIST], frequency: "monthly", streams: [monthly]}
    tsl: {vic: [OUT_SOIL_TEMP], frequency: "daily if possible, else monthly", streams: [monthly], rule: "per layer, degC -> K"}
    snd: {vic: [OUT_SNOW_DEPTH], frequency: "daily if possible, else monthly", streams: [monthly], rule: "cm -> m"}
    snm: {vic: [OUT_SNOW_MELT], frequency: "daily if possible, else monthly", streams: [monthly]}
    swe: {vic: [OUT_SWE, OUT_SNOW_CANOPY], frequency: "monthly", streams: [monthly], rule: "sum"}
    canopystor: {vic: [OUT_WDEW], frequency: "monthly", streams: [monthly]}
    riverstor: {vic: [OUT_STREAM_MOIST], frequency: "monthly", streams: [monthly]}
    reservoirstor: {vic: [OUT_GDAM_STORAGE, OUT_LDAM_STORAGE], frequency: "monthly", streams: [monthly], rule: "hm3 -> kg m-2 over the cell area"}
    tws: {vic: [OUT_SOIL_MOIST, OUT_SWE, OUT_SNOW_CANOPY, OUT_WDEW, OUT_SURFSTOR, OUT_STREAM_MOIST, OUT_GDAM_STORAGE, OUT_LDAM_STORAGE], frequency: "monthly", streams: [monthly], rule: "sum of the stores"}
    lai: {vic: [OUT_LAI], frequency: "daily else monthly", streams: [monthly], rule: "grid-cell total"}
    airrww: {vic: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT], frequency: "monthly", streams: [monthly], rule: "sector 4 (irrigation)"}
    airrwwgw: {vic: [OUT_WI_GW_SECT], frequency: "monthly", streams: [monthly], rule: "sector 4"}
    airruse: {vic: [OUT_RECEIVED], frequency: "monthly", streams: [monthly]}
    adomww: {vic: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT], frequency: "monthly", streams: [monthly], rule: "sector 0 (municipal)"}
    adomwwgw: {vic: [OUT_WI_GW_SECT], frequency: "monthly", streams: [monthly], rule: "sector 0"}
    adomuse: {vic: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT], frequency: "monthly", streams: [monthly], rule: "sector 0 withdrawal x municipal consumption fraction of the forcing"}
    pdomww: {vic: [OUT_DE_GW_SECT, OUT_DE_SURF_SECT], frequency: "monthly", streams: [monthly], rule: "sector 0"}
    pdomwwgw: {vic: [OUT_DE_GW_SECT], frequency: "monthly", streams: [monthly], rule: "sector 0"}
    aindww: {vic: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT], frequency: "monthly", streams: [monthly], rule: "sector 2 (manufacturing = ISIMIP industrial)"}
    aindwwgw: {vic: [OUT_WI_GW_SECT], frequency: "monthly", streams: [monthly], rule: "sector 2"}
    ainduse: {vic: [OUT_WI_GW_SECT, OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT], frequency: "monthly", streams: [monthly], rule: "sector 2 withdrawal x manufacturing consumption fraction of the forcing"}
    pindww: {vic: [OUT_DE_GW_SECT, OUT_DE_SURF_SECT], frequency: "monthly", streams: [monthly], rule: "sector 2"}
    pindwwgw: {vic: [OUT_DE_GW_SECT], frequency: "monthly", streams: [monthly], rule: "sector 2"}
    atotww: {vic: [OUT_WITHDRAWN], frequency: "monthly", streams: [monthly]}
    atotuse: {vic: [OUT_CONSUMED], frequency: "monthly", streams: [monthly]}
    ptotww: {vic: [OUT_DEMAND], frequency: "monthly", streams: [monthly]}
    atotwwgw: {vic: [OUT_WI_GW_SECT], frequency: "monthly", streams: [monthly], rule: "sum over sectors"}
    ptotwwgw: {vic: [OUT_DE_GW_SECT], frequency: "monthly", streams: [monthly], rule: "sum over sectors"}
  # written after each run by its check job (workflow/05_simulation/monitor/check_run.py, submitted by
  # submit_run.py to start when the run succeeds) into qc/runs/<campaign>/<run-id>/reports/
  derived:
    water_use_by_sector: >-
      water_use_by_sector_<year>.nc: monthly withdrawal per sector (municipal, manufacturing, irrigation) and
      its sources (groundwater, surface, dam, remote, nonrenewable), VIC demand and consumption estimated with
      the forcing consumption fraction (municipal, manufacturing), mm per month on the 5 arcmin grid; VIC-WUR
      writes the sources per sector but no total per sector
    grdc_comparison: >-
      grdc_stations.csv and figures: simulated discharge at the GRDC stations (raw/external/grdc, catchments
      >= 10 000 km2) against the GRDC monthly climatology of the run years +- 10 years, and daily series of the
      same dates for visual reference
  # written for the run checks (water and energy balance, water-use budget, irrigation, non-renewable deficit), not
  # ISIMIP variables; the same list as the production campaign
  diagnostics:
    monthly: [OUT_PREC, OUT_AIR_TEMP, OUT_RECHARGE, OUT_EVAP_BARE, OUT_EVAP_CANOP, OUT_TRANSP_VEG, OUT_SUB_SNOW,
              OUT_RETURNED, OUT_WI_REM_SECT, OUT_DE_REM_SECT, OUT_DE_TREM_SECT, OUT_DE_NREN_SECT,
              OUT_REQUIREMENT, OUT_APPLIED, OUT_SHORTAGE, OUT_LEFTOVER, OUT_WATER_ERROR, OUT_ENERGY_ERROR,
              OUT_NONREN_DEFICIT]
  # D03 decision 2 (user, 2026-10-22): the historical and future segments (1850-2100, every climate scenario, picontrol
  # included) also write these daily, in addition to the protocol mapping; the pre-industrial segment and the
  # spin-ups do not. The monthly stream is the same in every period.
  period_outputs:
    daily:
      historical: [OUT_SOIL_MOIST, OUT_EVAP, OUT_WITHDRAWN]
      future: [OUT_SOIL_MOIST, OUT_EVAP, OUT_WITHDRAWN]
  # A spin-up writes only these monthly variables (D19 spin-up rule 3): those of the convergence test (soil moisture
  # per layer, snow water equivalent for the December values, river storage, reservoir storage, irrigation withdrawal
  # by source for the 2021soc chain) and the non-renewable deficit, which is not tested but shows how much deficit the
  # spin-up hands to its children (user, 2026-10-28).
  spinup:
    monthly: [OUT_SOIL_MOIST, OUT_SWE, OUT_STREAM_MOIST, OUT_GDAM_STORAGE, OUT_LDAM_STORAGE, OUT_WI_GW_SECT,
              OUT_WI_SURF_SECT, OUT_WI_DAM_SECT, OUT_WI_TREM_SECT, OUT_WI_NREN_SECT, OUT_NONREN_DEFICIT]
  not_provided:
    qrf: no focussed recharge from surface water bodies (no groundwater layer under GWM FALSE)
    qrd: optional; equals qr for a model without a groundwater layer
    soilmoistfroz: FROZEN_SOIL FALSE, soil ice is not simulated
    thawdepth: FROZEN_SOIL FALSE
    glacierstor: no glacier model
    groundwstor: no groundwater store under GWM FALSE
    lakestor: LAKES FALSE
    wetlandstor: no wetland store
    triver: no river temperature model
    pirrww: D17 open; the sector-4 demand of VIC is the daily soil-moisture deficit asked again every day, not a withdrawal volume; needs runs with POTENTIAL_IRRIGATION TRUE
    pirrwwgw: as pirrww (D17)
    pirruse: as pirrww (D17)
    pirnreqcum: no crop growing-season accounting (WOFOST off)
    airrusegreen: VIC does not separate green and blue water
    pirrusegreen: VIC does not separate green and blue water
    arainfusegreen: VIC does not separate green and blue water
    amanww: manufacturing and electricity are not separated in the water-use forcing (reported as industrial)
    amanuse: as amanww
    aelecww: as amanww
    aelecuse: as amanww
    pmanww: as amanww
    pmanuse: as amanww
    pelecww: as amanww
    pelecuse: as amanww
    amanwwgw: as amanww
    amanusegw: as amanww
    aelecwwgw: as amanww
    aelecusegw: as amanww
    pmanwwgw: as amanww
    pmanusegw: as amanww
    pelecwwgw: as amanww
    pelecusegw: as amanww
    aliveww: no livestock sector
    aliveuse: no livestock sector
    pliveww: no livestock sector
    pliveuse: no livestock sector
    alivwwgw: no livestock sector
    alivusegw: no livestock sector
    plivwwgw: no livestock sector
    plivusegw: no livestock sector
    pdomuse: per-sector consumption is not written; derivable as pdomww x consumption fraction in postprocessing
    pinduse: as pdomuse
    ptotuse: as pdomuse
    adomusegw: per-sector consumption by source is not written
    aindusegw: as adomusegw
    airrusegw: as adomusegw
    pirrusegw: as adomusegw
    pdomusegw: as adomusegw
    pindusegw: as adomusegw
    atotusegw: as adomusegw
    ptotusegw: as adomusegw
    soil: static; from the parameter set in postprocessing, not a VIC output
    cellarea: static; from the domain file in postprocessing (D07)
    contfrac: static; from the domain file in postprocessing (D07)
    landfrac: static; from the domain file in postprocessing (D07)
    yield: no crop model (WOFOST off)
    evapcum: no crop model
    initrcum: no crop model
    plantday: no crop model
    plantyear: no crop model
    anthday: no crop model
    matyday: no crop model
    harvyear: no crop model
    biom: no crop model
    nupcum: no crop model
    nincum: no crop model
    nlosscum: no crop model
    nleachcum: no crop model

resources: configs/resources/vic-global-5arcmin.yaml

open_decisions:
  D06: decided 2026-11-01 (option B, extrasoc not simulated); not used by this campaign
  D07: aggregation to 0.5 degree open; postprocessing only, the 5 arcmin output does not depend on it
  D17: potential irrigation open; pirrww, pirrwwgw, pirruse not provided
