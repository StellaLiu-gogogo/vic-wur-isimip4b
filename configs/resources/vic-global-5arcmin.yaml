# Anunna resources of one VIC-WUR image-driver run on the global 5 arcmin domain with the plugin stack
# (routing with FILE decomposition, irrigation, dams, water use, land use). Read by
# workflow/05_simulation/render/render_run.py; the rendered job is kept in runs/<campaign>/<run-id>/config/.
workload: vic-global-5arcmin
partition: main
# AMD gen3 nodes: 128 cores and 1 TB memory each (72 nodes on 2026-10-04; sinfo -p main). One node type so
# that every rank uses the same library tree of the 2025 module bucket.
constraint: gen3
nodes: 1
# MPI ranks: the FILE decomposition of the parameter set has 128 groups (largest 372 255 of 2 188 551 active
# cells); VIC gives whole groups to ranks, largest first, so with 6 or more ranks the rank with the largest
# group sets the pace and more ranks shorten nothing (render_run.py checks ntasks <= groups). The cores go
# to OpenMP threads instead: 8 ranks x 16 threads fill one 128-core node (one rank per 16-core block).
ntasks: 8
cpus_per_task: 16
exclusive: true
# Measured on Anunna: MaxRSS 72.5 GB per rank in the smoke runs of 1 and 10 model years (no growth with run
# length), about 580 GB for 8 ranks; 700G leaves about 20 % margin. Anunna bills the requested memory
# (analysis compute-storage-plan, 2026-10-06).
mem: 700G
# Wall time = setup + per model year x years, rounded up to whole hours. Snellius: 1.07-1.10 h per model
# year on 192 cores with Force Time 79 % of Run Time; Anunna has 128 cores and a slower filesystem.
wall_time:
  setup_hours: 2.0
  hours_per_model_year: 3.0
  max_hours: 240
# Anunna's Slurm uses task/cgroup only: tasks share the job's cores and --cpu-bind has no effect, so no
# binding is requested (an OpenMP binding put all 8 ranks on core 0 in the first smoke attempt, 2026-10-04)
launcher: srun --mpi=pmix --cpus-per-task=${SLURM_CPUS_PER_TASK}
# Must equal runtime_modules of builds/vic/<commit>/build_manifest.json (the renderer checks).
modules:
  - "2025"
  - netCDF/4.9.3-gompi-2025a
# parallel checksum readers of the input verification step before VIC starts
check_processes: 8
