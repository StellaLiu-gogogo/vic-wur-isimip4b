parameter_set_id: vic-global-5arcmin-version-a
status: candidate
adopted: true
description: >-
  VIC-WUR global 5 arcmin parameter set adopted from the sibling vic_coupled
  and vic_parameter projects. Present: the domain and the assembled natural
  static parameter bundle (soil, vegetation, snow bands), and the adopted
  16-class Human Impact Version A bundle (base of the vegetation component);
  the vegetation component with the full union of land-use tiles (D04) is
  generated by workflow/03_parameters/vegetation/.
location: parameters/candidates/vic-global-5arcmin-version-a/
adopted_on: 2026-09-29
components:
  domain:
    source: /lustre/nobackup/WUR/ESG/liu297/vic_coupled/Data/VIC/domain/global/vic_global_5min_domain_nogl.nc
    source_mtime: 2025-04-17
    files:
      - path: domain/vic_global_5min_domain_nogl.nc
        size_bytes: 87147802
        md5: 8a50b807b83db364a3db0d23e1ed3849
    verification: md5 of the copy equals md5 of the source (2026-09-29)
    qc_status: not_checked
  bundle:
    description: >-
      Assembled VIC image-driver parameter file (soil SoilGrids2 continuous
      Cosby v10, root variant Root-B Zeng 2001, vegetation VIC-14 static with
      the static/dynamic 2003-2022 tile union, snow bands from the HydroSHEDS
      30 arcsec DEM). Its elev variable is the target elevation of the climate
      forcing (workflow/04_forcing/climate/). The copy was renamed because
      version-like tokens are not allowed in the workdir; content unchanged.
    source: /lustre/nobackup/WUR/ESG/liu297/vic_global/vic_parameter/outputs/natural/bundles/v3/vic_global_5min_natural_static_soil-v10_root-b-zeng2001_v3.nc
    source_build_report: /lustre/nobackup/WUR/ESG/liu297/vic_global/vic_parameter/outputs/natural/bundles/v3/build_report_root-b_v3.json
    source_mtime: 2026-08-22
    adopted_on: 2026-09-30
    files:
      - path: bundle/vic_global_5min_natural_static_root-b-zeng2001.nc
        size_bytes: 2085769070
        md5: e5cf464691020bc5ac40a293a13e3eef
    verification: >-
      md5 of the copy equals md5 of the source and the output_md5 of the
      source build report (2026-09-30); lat and lon equal the domain file
      exactly; run_cell equals the domain mask (2 188 551 cells)
    notes: >-
      The source file carries the global attributes
      not_authorized_for_global_production = "true" and
      product_stage = "image_driver_smoke_candidate". Its vegetation has 14
      VIC classes, whereas the land-use forcing (04_forcing/landuse) has 16;
      a run that combines both must resolve this first.
    qc_status: not_checked
  bundle_16class:
    component: bundle
    description: >-
      Second adopted image-driver file of the bundle component: the
      vic_parameter Human Impact Version A 16-class bundle (class contract
      1-11 natural, 12 rainfed crop, 13 urban, 14 irrigated non-paddy, 15
      irrigated paddy, 16 barren; tiles = VIC coverage 2003-2022 union with
      placeholder Cv 1e-12). Base of the vegetation component
      (workflow/03_parameters/vegetation/). It drove the vic_parameter H-line
      runs including the 41-year 1979-2019 production. The copy was renamed
      because version-like tokens are not allowed in the workdir; content
      unchanged.
    source: /lustre/nobackup/WUR/ESG/liu297/vic_global/vic_parameter/outputs/human_impact/version_a/v1/vic_global_5min_HumanImpact_VersionA_16class_soil-v10_root-b_v3.nc
    source_mtime: 2026-08-17
    adopted_on: 2026-10-01
    files:
      - path: bundle/vic_global_5min_humanimpact_16class_root-b-zeng2001.nc
        size_bytes: 2237111071
        md5: 1422f3ea2394faf5ce186bc18c4c51d1
    verification: >-
      md5 of the copy equals md5 of the source (2026-10-01); all 55
      non-vegetation variables (soil, snow bands, elev, run_cell, ...) are
      bitwise identical to bundle/vic_global_5min_natural_static_root-b-zeng2001.nc
    notes: >-
      Same attributes not_authorized_for_global_production = "true" and
      product_stage = "image_driver_smoke_candidate" as the natural bundle.
      Known defect corrected by the vegetation component, not in this file:
      fcanopy = 0 on 7 735 524 class-16 tile-months (VIC MIN_FCANOPY is
      1e-4). Classes 12, 14 and 15 share one LAI/fcanopy/albedo climatology.
    qc_status: not_checked
  vegetation:
    status: land-use vegetation with the full tile union (D04) deferred until D01 is frozen
