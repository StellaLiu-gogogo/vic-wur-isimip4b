dataset_id: koppen-geiger
version: beck2023
source: >-
  Beck, H. E., T. R. McVicar, N. Vergopolan, A. Berg, N. J. Lutsko, A. Dufour,
  Z. Zeng, X. Jiang, A. I. J. M. van Dijk, and D. G. Miralles: High-resolution
  (1 km) Koppen-Geiger maps for 1901-2099 based on constrained CMIP6
  projections, Scientific Data 10, 724 (2023). Official GeoTIFF archive
  downloaded by the user (2026-03) and kept unpacked in
  /lustre/nobackup/WUR/ESG/liu297/vic_global/01oc_natural/10Analysis/01paper/05SwGwInteraction/koppen_geiger_tif/;
  copied from there on 2026-10-01 (user, 2026-10-01: that copy is the official
  download).
description: >-
  Koppen-Geiger climate classes 1-30 (legend.txt; 0 = no data / ocean) for the
  period 1991-2020 on regular latitude-longitude grids from 90N and 180W at
  1/120, 0.1, 0.5 and 1 degree. Only the 1991-2020 subset is copied (D04 item
  5); directory and file names are kept as delivered. Used by
  workflow/03_parameters/vegetation/ (donor level L3 of the parameter backfill
  for tiles added by the land-use tile union), from the 1/120 degree map
  reduced to the 5 arcmin VIC grid by majority.
