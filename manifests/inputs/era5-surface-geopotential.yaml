description: >-
  ERA5 surface geopotential (GRIB paramId 129, invariant in time) on the native
  0.25 degree regular grid (721 x 1440, latitude 90 to -90, longitude 0 to
  359.75), converted from GRIB to NetCDF by the CDS (cfgrib 0.9.15.1, ecCodes
  2.48.2). Used by workflow/04_forcing/climate/ as the reference elevation of the
  ISIMIP4b 0.5 degree bias-adjusted climate (surface height = z / 9.80665,
  first-order conservative remapping to the ISIMIP grid). The file name is kept
  as delivered by the CDS.
