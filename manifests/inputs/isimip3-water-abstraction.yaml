dataset_id: isimip3-water-abstraction
version: dkrz-2026-10-02
source: >-
  DKRZ levante /work/bb0820/ISIMIP/ (ISIMIP3a and ISIMIP3b InputData,
  socioeconomic/water_abstraction), transferred with
  workflow/01_acquisition/transfer_batch.sh (batch id
  isimip3-water-abstraction, src-root /work/bb0820/ISIMIP); the same files are
  published in the ISIMIP repository (data.isimip.org) under the DOIs below.
description: >-
  ISIMIP3a/ISIMIP3b harmonized domestic (dom) and industrial (ind) water
  withdrawal (ww) and consumption (wc), 0.5 degree, annual, m3/yr per grid
  cell. Substitute for the unreleased ISIMIP4b non-irrigation water use
  (decision D05). Subset: ISIMIP3a histsoc (1850-2021); ISIMIP3b histsoc
  (1601-2014), 1850soc and 2015soc (1601-2100), ssp126soc-noadapt and
  ssp370soc-noadapt (2015-2100, withdrawal only, multi-model mean and
  standard deviation). Not taken: ISIMIP3a 1901soc and 2015soc,
  ISIMIP3b ssp585soc-noadapt. DKRZ paths below ISIMIP/ are kept unchanged.
