version: snapshot-2026-10-02
source: >-
  /lustre/backup/WUR/ESG/marin052/waterUseForcing/ (the water-use forcing
  chain of the sibling project, R and cdo), copied on 2026-10-02 from
  domestic/input/, industrial/input/, irrigation/input/ and input/. The
  subpaths below the source root are kept.
description: >-
  Static fractions of sector water withdrawal taken from groundwater, one
  value per WaterGAP 0.5 degree land cell, as tab-separated text tables
  (header "Arc_ID" "VALUE", CRLF line ends, 67 420 rows):
  G_FRACTGW_DOM (domestic), G_FRACTGW_MAN (manufacturing; there is no
  separate table for thermal power / energy), G_FRACTGW_IRRIG (irrigation).
  Arc_ID_lon_lat_continentalarea.txt maps Arc_ID to the cell-centre lon/lat
  and the continental area in km2 (header Arc_ID lon lat cont_area_km2).
  No livestock table exists in the source: the source chain set the livestock
  groundwater fraction to 1 everywhere
  (livestock/scripts/createLivestockGroundwaterFraction.sh), so nothing was
  copied for livestock. Used by decision D05 (item 5) for static groundwater
  fractions.
provenance: >-
  Copied from the water-use forcing chain of the sibling project (source
  above), where the tables are the inputs of the scripts
  createDomesticGroundwaterFraction.R, createManufacturingGroundwaterFraction.R
  and createIrrigationGroundwaterFraction.R. The names G_FRACTGW_* and the
  Arc_ID cell numbering are those of the WaterGAP global hydrological model
  (0.5 degree, 67 420 land cells). The files carry no metadata; the WaterGAP
  version, the reference period of the fractions and the citation are not
  recorded in the source directory.
