dataset_id: global-dam-watch
version: '1.0'
source: >-
  Global Dam Watch (GDW) database v1.0, downloaded by the user from the GDW
  distribution (globaldamwatch.org) into the legacy area
  /lustre/nobackup/WUR/ESG/liu297/vic_global/00pre_analysis/downscaling5min/08HumanImpact/01Dam/Data/
  (file dates 2025-10-09; the latest published version at acquisition), and
  copied from there on 2026-10-11 (task L, decision D19). The subpaths below
  the source root are kept; upstream names are unchanged.
citation: >-
  Lehner, B., Beames, P., Mulligan, M., Zarfl, C., De Felice, L., et al.
  (2024): The Global Dam Watch database of river barrier and reservoir
  information for large-scale applications. Scientific Data (citation as
  given in section 4 of GDW_TechDoc_v1_0.pdf, this location; the
  documentation leaves volume and DOI to be inserted).
description: >-
  ESRI shapefiles in WGS84 geographic coordinates (.prj GCS_WGS_1984), UTF-8
  attributes (.cpg). GDW_v1_0_shp/GDW_barriers_v1_0: 41 145 records, point
  geometry (shape type 1), every barrier including those without a mapped
  reservoir; LAT_DAM/LONG_DAM are 0 in 35 032 records, so the dam location is
  the point geometry; GDW_barriers_v1_0.txt is the same attribute table as
  comma-separated text. GDW_v1_0_shp/GDW_reservoirs_v1_0: 35 295 records,
  polygon geometry (shape type 5), with LAT_DAM/LONG_DAM. Both layers carry
  GDW_ID, GRAND_ID, names, YEAR_DAM, CAP_MCM, DOR_PC, CATCH_SKM, the use
  flags USE_IRRI, USE_ELEC, USE_SUPP, ... and MAIN_USE, and QUALITY; -99
  marks a missing value (e.g. CAP_MCM, DOR_PC). .sbn/.sbx are the ArcGIS
  spatial indexes as delivered. Used by workflow/03_parameters/dams/
  (decision D19: dam locations and identifiers of the ISIMIP4b dams).
location: raw/external/global-dam-watch/1.0/
acquired: 2026-10-11
licence: >-
  Creative Commons Attribution 4.0 International (CC BY 4.0), section 4.1 of
  GDW_TechDoc_v1_0.pdf; the authors ask users not to redistribute the data in
  whole in its original format on other websites without their written
  permission. Not part of any delivery.
